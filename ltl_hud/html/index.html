<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZSX User Interface V2</title>
  <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
  <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js" integrity="sha384-rOA1PnstxnOBLzCLMcre8ybwbTmemjzdNlILg8O7z1lUkLXozs4DHonlDtnE7fpc" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/hud.css">
  <link rel="stylesheet" href="./css/hud-basic.css">
  <link rel="stylesheet" href="./css/hud-skew.css">
  <link rel="stylesheet" href="./css/hud-diamond.css">
  <link rel="stylesheet" href="./css/hud-modern.css">
  <link rel="stylesheet" href="./css/hud-circle.css">
  <link rel="stylesheet" href="./css/hud-hexagon.css">
  <link rel="stylesheet" href="./css/hud-square.css">
  <link rel="stylesheet" href="./css/notify.css">
  <link rel="stylesheet" href="./css/notify-basic.css">
  <link rel="stylesheet" href="./css/notify-modern.css">
  <link rel="stylesheet" href="./css/notify-default.css">
  <link rel="stylesheet" href="./css/notify-diamond.css">
  <link rel="stylesheet" href="./css/default-notify.css">
  <link rel="stylesheet" href="./css/carhud.css">
  <link rel="stylesheet" href="./css/carhud-basic.css">
  <link rel="stylesheet" href="./css/carhud-default.css">
  <link rel="stylesheet" href="./css/perspective.css">
  <link rel="stylesheet" href="./css/voice.css">
  <link rel="stylesheet" href="./css/weapon-indicator.css">
  <link rel="stylesheet" href="./css/streetlabel.css">
  <link rel="stylesheet" href="./css/minimap.css">
  <link rel="stylesheet" href="./css/textui.css">
  <link rel="stylesheet" href="./css/progressbar.css">
  <link rel="stylesheet" href="./css/helpnotify.css">
  <link rel="stylesheet" href="./css/helpnotify-basic.css">
  <link rel="stylesheet" href="./css/helpnotify-hexagon.css">
  <link rel="stylesheet" href="./css/helpnotify-diamond.css">
  <link rel="stylesheet" href="./css/chat.css">
  <link rel="stylesheet" href="./css/menu.css">
  <link rel="stylesheet" href="./css/game-menu.css">
  <link rel="stylesheet" href="./css/settings-select.css">
  <link rel="stylesheet" href="./css/settings-inputs.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/settings-misc.css">
  <link rel="stylesheet" href="./css/position.css">
  <link rel="stylesheet" href="./css/main-menu.css">
  <link rel="stylesheet" href="./css/cinematic.css">
  <link rel="stylesheet" href="./css/top-content.css">
  <link rel="stylesheet" href="./css/displayer.css">
  <link rel="stylesheet" href="./css/pause-menu.css">
  <link rel="stylesheet" href="./css/welcome.css">
  <link rel="stylesheet" href="./css/welcome-music.css">
  <link rel="stylesheet" href="./css/welcome-presets.css">
  <link rel="stylesheet" href="./css/welcome-customize.css">
  <link rel="stylesheet" href="./css/welcome-inputs.css">
  <script type="module" src="./js/main.js"></script>
</head>

<body>
  <div id="screen-root">
    <div id="game-screen" class="screen ui-screen">
      <div id="hud-content" class="hud-content"></div>
      <div id="notify-content" class="notify-content"></div>
      <div id="carhud-content" class="carhud-content"></div>
      <div class="3d-content">
        <div id="perspective-handler" class="perspective-handler">
          <div id="keybinds-content" class="keybinds-content"></div>
          <div id="perspective-content" class="perspective-content">
            <div id="hold-wrapper" class="hold-wrapper" style="transform: translateZ(-30px) scale(1)">
              <div id="hold-content" class="hold-content">
                <div id="hud-3d" class="hud"></div>
              </div>
            </div>
            <div id="perspective-pre-row" class="pre-row">
              <div id="voice-indicator" class="voice-indicator" style="transform: translateZ(-20px) scale(1)">
                <div class="row">
                  <div class="icon"><i class="fas fa-microphone"></i></div>
                  <div class="text"></div>
                </div>
                <div class="progress">
                  <div class="value"></div>
                </div>
              </div>
              <div class="column">
                <div id="status-sprint" class="status-element">
                  <div class="icon"><i class="fas fa-running"></i></div>
                  <div class="progress">
                    <div class="value"></div>
                  </div>
                </div>
                <div id="status-oxygen" class="status-element">
                  <div class="icon"><i class="fas fa-lungs"></i></div>
                  <div class="progress">
                    <div class="value"></div>
                  </div>
                </div>
              </div>
            </div>
            <div id="weapon-indicator-3d" class="weapon-indicator" style="transform: translateZ(-10px) scale(.7)">
              <div class="row">
                <div class="weapon-data">
                  <div class="label"></div>
                  <div class="text-content">
                    <div class="icon">
                      <div class="square"></div>
                    </div>
                    <div class="name"></div>
                  </div>
                </div>
                <div class="weapon-ammo">
                  <div class="ammo"></div>
                  <div class="magazines"></div>
                </div>
              </div>
              <div class="progress">
                <div class="value"></div>
              </div>
            </div>
            <div id="notify-3d-wrapper" class="visible-content" style="transform: translateZ(0px)">
              <div id="notify-3d" class="notify-content"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="weapon-indicator-2d-content" class="weapon-indicator-2d-content">
        <div id="weapon-indicator-2d" class="weapon-indicator">
          <div class="row">
            <div class="weapon-data">
              <div class="label"></div>
              <div class="text-content">
                <div class="icon">
                  <div class="square"></div>
                </div>
                <div class="name"></div>
              </div>
            </div>
            <div class="weapon-ammo">
              <div class="ammo"></div>
              <div class="magazines"></div>
            </div>
          </div>
          <div class="progress">
            <div class="value"></div>
          </div>
        </div>
      </div>
      <div id="minimap-data" class="minimap-data">
        <div class="content">
          <div id="default-notifies" class="default-notifies"></div>
          <div id="street-label" class="street-label">
            <div class="direction"></div>
            <div class="row">
              <div class="street">
                <div class="street-primary"></div>
                <div class="street-secondary"></div>
              </div>
              <div class="col">
                <div class="time"></div>
                <div class="distance"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="aio-menu" class="menu">
        <div class="elements"></div>
        <div class="icon">
          <i class="fas fa-chevron-up"></i>
          <i class="fas fa-chevron-down"></i>
        </div>
      </div>
      <div id="top-content" class="top-content"></div>
      <div id="top-left-content" class="top-left-content">
        <div id="helpnotify-content" class="helpnotify-content"></div>
        <div id="chat-content" class="chat-content">
          <div class="chat-messages"></div>
          <div class="chat-input">
            <div class="liner"></div>
            <div class="content">
              <div class="chat-pre-input">
                <input class="chat-input-proper" type="text" />
                <div class="message-input-content-bg"></div>
              </div>
              <div class="suggestions"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="top-right-content" class="top-right-content">
        <div id="player-displayer" class="displayers-content"></div>
        <div id="server-logo" class="server-logo"><img src="" alt="" /></div>
      </div>
    </div>
    <div id="main-menu-screen" class="main-menu-screen">
      <div class="screen-sliders">
        <div class="bar">
          <div class="bg"></div>
          <div class="line"></div>
        </div>
        <div class="bar">
          <div class="line"></div>
          <div class="bg"></div>
        </div>
      </div>
      <div class="top-nav">
        <div class="connected-box"></div>
        <div class="redirects"></div>
      </div>
      <div class="center">
        <div class="logo"><img src="" /></div>
        <div class="text"></div>
      </div>
      <div class="bottom"></div>
    </div>
    <div id="game-menu-screen" class="game-menu" tabindex="0">
      <div class="interface-options">
        <div class="header-box">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="header"></div>
        </div>
        <div class="navbar-box">
          <div class="navbar-items"></div>
          <div class="navbar-line"></div>
          <div class="row full-row-div">
            <div class="game-menu-list-parent">
              <div id="settings-color" class="game-menu-child"></div>
              <div id="settings-hud" class="game-menu-child"></div>
              <div id="settings-carhud" class="game-menu-child"></div>
              <div id="settings-notifications" class="game-menu-child"></div>
              <div id="settings-progressbar" class="game-menu-child"></div>
              <div id="settings-helpnotify" class="game-menu-child"></div>
              <div id="settings-misc" class="game-menu-child"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="position-screen" class="position-screen"></div>
    <div id="cinematic-screen" class="cinematic"></div>
    <div id="pause-menu-screen" class="pause-menu-screen">
      <div class="screen-slide"></div>
      <div class="row">
        <div class="user-data">
          <div class="avatar"></div>
          <div class="column"></div>
        </div>
        <div class="server-navs"></div>
      </div>
      <div class="logo-part"><img src="" alt="Logo du serveur" /></div>
      <div class="nav-info"></div>
      <div class="navbar">
        <div class="quit-game"></div>
      </div>
    </div>
    <div id="welcome-screen" class="main-welcome">
      <div class="welcome-content">
        <div class="icon">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2L2 14M2 2L14 14" stroke="white" stroke-width="3"></path>
          </svg>
        </div>
      </div>
      <div class="view-content"></div>
    </div>
  </div>
  <div id="stagger-root"></div>
  <div id="progress-root" class="pre-progress">
    <div id="progressbar-content" class="progressbar-content"></div>
  </div>
  <div id="black-screen" class="black-screen"></div>
  <div id="music-root"></div>
</body>

</html>
